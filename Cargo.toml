[package]
name = "paymos"
version = "1.2.0"
edition = "2021"
rust-version = "1.86"
description = "Official Rust SDK for the Paymos Merchant API"
license = "MIT"
repository = "https://github.com/Paymos-labs/rust-sdk"
homepage = "https://paymos.io"
documentation = "https://docs.rs/paymos"
readme = "README.md"
keywords = ["paymos", "payments", "merchant", "stablecoin", "api"]
categories = ["api-bindings", "web-programming::http-client", "cryptography"]
include = [
  "/src/**",
  "/tests/**",
  "/conformance/contract.json",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[dependencies]
base64 = "0.22.1"
hex = "0.4.3"
hmac = "0.13.0"
httpdate = "1.0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.0", features = ["time"] }
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
