name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crates-io:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.86.0 --profile minimal --component rustfmt,clippy
          rustup default 1.86.0
      - name: Verify immutable release version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$actual" = "$expected"
          grep -Fx "pub const SDK_VERSION: &str = \"$expected\";" src/version.rs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
      - run: cargo package --locked
      - name: Authenticate to crates.io with Trusted Publishing
        if: github.ref_name != 'v1.0.0'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish bootstrap release to crates.io
        if: github.ref_name == 'v1.0.0'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - name: Publish to crates.io with Trusted Publishing
        if: github.ref_name != 'v1.0.0'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked
